apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingress-query
  namespace: ingress-query
  labels:
    app.kubernetes.io/name: ingress-query
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ingress-query
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ingress-query
    spec:
      serviceAccountName: ingress-query
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ingress-query
          image: ingress-query:0.1.0   # <-- change to your registry/image
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 192Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
